name: Release

# Cutting a version tag publishes the two executables as release assets, so a
# release is downloadable rather than just a tag with notes.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $zip = "hyprwin-${{ github.ref_name }}-windows-x86_64.zip"
          Compress-Archive -Path `
            target/release/hyprwin.exe, `
            target/release/hyprwinctl.exe, `
            README.md, `
            LICENSE `
            -DestinationPath $zip
          Write-Output "packaged $zip"
      - name: Upload to the release
        uses: softprops/action-gh-release@v2
        with:
          files: hyprwin-${{ github.ref_name }}-windows-x86_64.zip
